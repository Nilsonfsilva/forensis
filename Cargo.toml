[workspace]

members = [
"crates/forensis-core",
"crates/forensis-cli",
"crates/forensis-app",
"crates/forensis-tui",
]

resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Josenilson Ferreira da Silva <nilsonfsilva@hotmail.com>"]
license = "GPL-3.0-or-later"
rust-version = "1.82"
description = "Forensis: forensic analysis and recovery directly from disk bytes."
readme = "README.md"
keywords = ["forensics", "filesystem", "ntfs", "recovery", "disk"]
categories = ["forensics", "filesystem", "parser-implementations"]

[workspace.package.metadata]
date = "2026-09-12"

[workspace.dependencies]

anyhow = "1"
sha2 = "0.10"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }

ratatui = "0.29"
crossterm = "0.28"
